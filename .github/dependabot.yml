version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      chakra-ui:
        patterns:
          - "@chakra-ui/*"
      emotion:
        patterns:
          - "@emotion/*"
      next:
        patterns:
          - "next*"
          - "@next/*"
      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react*"
      dev-tools:
        patterns:
          - "typescript"
          - "postcss"
    open-pull-requests-limit: 10
    reviewers:
      - "ko1ynnky"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
